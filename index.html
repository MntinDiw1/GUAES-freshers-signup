<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUAES Sign Up</title>
<style>
  /*
    ---------------------------------------------------------------
    SETUP (do this once — see SETUP.md for full step-by-step):
    1. Create a Google Sheet for responses.
    2. Extensions > Apps Script, paste apps-script.gs, deploy as
       Web App ("Anyone" can access), copy the /exec URL.
    3. Paste that URL into SCRIPT_URL below.
    4. Host this file anywhere (GitHub Pages, Google Sites, Netlify)
       and point your QR code at that URL.
    ---------------------------------------------------------------
  */
  :root{
    --maroon:#4a0e0e;
    --dark:#260707;
    --cream:#f6efd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--dark);
    color:var(--cream);
    font-family:"Neue Haas Grotesk Display","Neue Haas Grotesk Text",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:1.5rem 1rem;
    overflow-x:hidden;
  }
  .page{
    width:100%;
    max-width:480px;
  }
  header{
    color:var(--cream);
    padding:2.5rem 1.5rem;
    position:relative;
    overflow:hidden;
    min-height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  header .wave-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  header .content{
    position:relative;
    z-index:1;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header h1{
    margin:0;
    font-size:3rem;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:0.95;
    -webkit-text-stroke:2px var(--dark);
    text-shadow:0 4px 14px rgba(0,0,0,.55);
  }
  header p{
    margin:.6rem 0 0;
    font-size:.95rem;
    font-weight:700;
    max-width:30ch;
    -webkit-text-stroke:.75px var(--dark);
    text-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  main{padding:1.75rem 1.5rem 2.5rem;}
  .field{margin-bottom:1.5rem;}
  label{
    display:block;
    font-weight:700;
    font-size:.95rem;
    margin-bottom:.4rem;
  }
  .hint{
    font-size:.78rem;
    opacity:.65;
    margin:-.25rem 0 .5rem;
  }
  input[type="text"],
  input[type="email"],
  textarea,
  select{
    width:100%;
    border:2px solid var(--cream);
    background:transparent;
    color:var(--cream);
    border-radius:6px;
    padding:.65rem .75rem;
    font-size:1rem;
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:4.5rem;}
  input::placeholder,textarea::placeholder{color:var(--cream);opacity:.45;}
  .checks{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
  }
  .checks label{
    display:flex;
    align-items:center;
    gap:.4rem;
    font-weight:500;
    font-size:.9rem;
    border:2px solid var(--cream);
    border-radius:20px;
    padding:.4rem .8rem;
    cursor:pointer;
    margin:0;
  }
  .checks input{accent-color:var(--cream);}
  fieldset{border:none;padding:0;margin:0;}
  legend{
    font-weight:700;
    font-size:.95rem;
    margin-bottom:.5rem;
    padding:0;
  }
  button{
    width:100%;
    background:var(--cream);
    color:var(--dark);
    border:none;
    border-radius:6px;
    padding:.9rem;
    font-size:1.05rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    letter-spacing:.01em;
  }
  button:disabled{opacity:.6;cursor:default;}
  .status{
    margin-top:1rem;
    font-size:.9rem;
    text-align:center;
    min-height:1.2em;
  }
  .status.error{color:#ff9b9b;}
  .success{
    text-align:center;
    padding:3rem 1.5rem;
  }
  .success h2{font-size:1.6rem;margin-bottom:.5rem;}
  .discord-btn{
    display:inline-block;
    margin-top:1.5rem;
    background:var(--cream);
    color:var(--dark);
    text-decoration:none;
    font-weight:700;
    border-radius:6px;
    padding:.75rem 1.5rem;
    letter-spacing:.01em;
  }
  footer{
    text-align:center;
    font-size:.75rem;
    opacity:.55;
    padding:0 1.5rem 2rem;
  }
  /* honeypot */
  .hp{position:absolute;left:-9999px;top:-9999px;}
</style>
</head>
<body>
<div class="page">
  <header>
    <svg class="wave-bg" id="waveBg" viewBox="0 0 200 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="content">
      <h1>GUAES</h1>
      <p>Contributor Application Form</p>
    </div>
  </header>

  <main>
    <form id="signupForm">
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="Name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Student email</label>
        <input type="email" id="email" name="Email" required autocomplete="email" placeholder="you@student.gla.ac.uk">
      </div>

      <div class="field">
        <label for="yearcourse">Year of study & course</label>
        <input type="text" id="yearcourse" name="Year of study & course" placeholder="e.g. 2nd year, Electronics & Electrical Engineering">
      </div>

      <div class="field">
        <label for="genre">Favourite genre</label>
        <input type="text" id="genre" name="Favourite genre" placeholder="e.g. IDM, electronica, jazz">
      </div>

      <div class="field">
        <fieldset>
          <legend>Experience (tick any that apply)</legend>
          <div class="checks">
            <label><input type="checkbox" name="Experience" value="Synth/FX pedal design"> Synth/FX pedal design</label>
            <label><input type="checkbox" name="Experience" value="Music production"> Music production</label>
            <label><input type="checkbox" name="Experience" value="DJing"> DJing</label>
            <label><input type="checkbox" name="Experience" value="Soldering"> Soldering</label>
            <label><input type="checkbox" name="Experience" value="Misc. audio projects"> Misc. audio projects</label>
            <label><input type="checkbox" name="Experience" value="None yet"> None yet — keen to learn</label>
          </div>
        </fieldset>
      </div>

      <div class="field">
        <label for="contribute">What would you like to contribute?</label>
        <textarea id="contribute" name="Contribution"></textarea>
      </div>

      <div class="field">
        <label for="events">What events would you like us to run?</label>
        <textarea id="events" name="Event ideas"></textarea>
      </div>

      <button type="submit" id="submitBtn">Apply</button>
      <div class="status" id="status"></div>
    </form>

    <div class="success" id="successMsg" style="display:none;">
      <h2>You're in.</h2>
      <p>Thanks for signing up — we'll be in touch.</p>
      <a class="discord-btn" href="https://discord.gg/zP8eFg79cD" target="_blank" rel="noopener">Join our Discord</a>
    </div>
  </main>

  <footer>Your info is only used to contact you about the society</footer>
</div>

<script>
  // Draws the waveform backdrop: a higher-frequency sine envelope run through
  // a sample-and-hold + amplitude quantizer, like a bitcrushed audio signal —
  // a nod to GUAES's audio electronics, and an abstraction of the logo's
  // vertical-line waveform rather than a literal copy.
  (function drawWave() {
    const svg = document.getElementById('waveBg');
    const NS = 'http://www.w3.org/2000/svg';
    const W = 200, H = 90, CENTER = H / 2;
    const BARS = 130;
    const barW = (W / BARS) * 0.62;
    const CYCLES = 6;       // sine cycles across the width — starts/ends at 0
    const AMP = 41;         // peak half-height, in viewBox units
    const MIN_H = 2.5;      // never fully pinch to zero at the nodes
    const HOLD = 3;         // bars per sample-and-hold step (sample-rate reduction)
    const BIT_LEVELS = 5;   // discrete amplitude steps (bit-depth reduction)

    function hash(i) {
      const s = Math.sin(i * 12.9898) * 43758.5453;
      return s - Math.floor(s);
    }

    const frag = document.createDocumentFragment();
    for (let i = 0; i < BARS; i++) {
      // sample-and-hold: quantize which t a whole block of bars reads
      const blockIndex = Math.floor(i / HOLD);
      const holdT = (blockIndex * HOLD) / (BARS - 1);

      const raw = Math.abs(Math.sin(holdT * CYCLES * Math.PI * 2));
      const level = Math.round(raw * BIT_LEVELS) / BIT_LEVELS; // bit-depth reduction
      const half = Math.max(level * AMP, MIN_H);

      const t = i / (BARS - 1);
      const x = t * W;

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', (x - barW / 2).toFixed(2));
      rect.setAttribute('y', (CENTER - half).toFixed(2));
      rect.setAttribute('width', barW.toFixed(2));
      rect.setAttribute('height', (half * 2).toFixed(2));
      rect.setAttribute('fill', '#f6efd8');
      rect.setAttribute('opacity', (0.72 + hash(blockIndex) * 0.23).toFixed(2));
      frag.appendChild(rect);
    }
    svg.appendChild(frag);
  })();

  // Replace with your Apps Script Web App /exec URL — see SETUP.md
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwg3U3QCps_pgaEDHlVw-56snyrTSYTfentDq7qbBAHXCZVig7CHACLJIDX1o_wI7_FJA/exec";

  const form = document.getElementById('signupForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (form._gotcha.value) return; // honeypot tripped, silently drop

    if (SCRIPT_URL.includes('PASTE_YOUR')) {
      status.textContent = 'Form not connected yet — set SCRIPT_URL in signup.html.';
      status.classList.add('error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.classList.remove('error');

    const formData = new FormData(form);
    // collapse repeated "Experience" checkboxes into one comma-separated field
    const experience = formData.getAll('Experience').join(', ');
    const payload = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (key === 'Experience' || key === '_gotcha') continue;
      payload.append(key, value);
    }
    payload.append('Experience', experience);
    payload.append('Submitted', new Date().toISOString());

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Apps Script doesn't return CORS headers; we can't read
        body: payload    // the response, so we just assume success if no network error
      });
      form.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (err) {
      status.textContent = 'Something went wrong — please try again.';
      status.classList.add('error');
      btn.disabled = false;
      btn.textContent = 'Apply';
    }
  });
</script>
</body>
</html>
