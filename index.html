<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUAES</title>
<style>
  :root{
    --maroon:#4a0e0e;
    --dark:#630704;
    --cream:#f6efd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--dark);
    color:var(--cream);
    font-family:"Neue Haas Grotesk Display","Neue Haas Grotesk Text",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:1.5rem 1rem;
    overflow-x:hidden;
  }
  .page{
    width:100%;
    max-width:480px;
  }
  header{
    color:var(--cream);
    padding:2.25rem 1.5rem 1.5rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  header .logo{
    width:68%;
    max-width:280px;
    height:auto;
    display:block;
  }
  main{padding:.5rem 1.5rem 2.5rem;}
  h1{
    text-align:center;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 1.5rem;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .choice{
    display:block;
    border:2px solid var(--cream);
    border-radius:6px;
    padding:1.25rem 1.5rem;
    text-decoration:none;
    color:var(--cream);
    transition:background .15s ease, color .15s ease;
  }
  .choice:hover,
  .choice:active{
    background:var(--cream);
    color:var(--dark);
  }
  .choice .title{
    display:block;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .choice .desc{
    display:block;
    margin-top:.3rem;
    font-size:.9rem;
    opacity:.8;
  }
  .choice:hover .desc,
  .choice:active .desc{
    opacity:.75;
  }
  footer{
    text-align:center;
    font-size:.75rem;
    opacity:.55;
    padding:0 1.5rem 2rem;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <img class="logo" src="logo-v2.png" alt="GUAES">
  </header>

  <main>
    <h1>Choose your path</h1>
    <div class="choices">
      <a class="choice" href="member.html">
        <span class="title">Member</span>
        <span class="desc">Join GUAES for free via the SRC, and hop into our Discord</span>
      </a>
      <a class="choice" href="contribute.html">
        <span class="title">Contributor</span>
        <span class="desc">Apply to help run events, projects and more</span>
      </a>
    </div>
  </main>

  <footer>Glasgow University Audio Electronics Society</footer>
</div>
</body>
</html>
